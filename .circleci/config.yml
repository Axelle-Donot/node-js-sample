version: 2.1

executors:
  vm-executor:
    machine: true
    working_directory: ~/app

jobs:
  say-hello:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Say hello"
          command: "echo Hello, World!"

  build-docker:
    executor: vm-executor
    steps:
      - checkout
      - run:
          name: Build Docker image
          command: |
            docker build -t monapp:latest .

      - run:
          name: Test Docker image
          command: |
            docker run --rm -d -p 8080:8080 --name test-container monapp:latest
            sleep 30  # Attendre un peu plus longtemps pour s'assurer que l'application démarre
            curl --fail http://127.0.0.1:8080/ || exit 1

workflows:
  version: 2
  build-workflow:
    jobs:
      - say-hello
      - build-docker
