version: 2.1

orbs:
  docker: circleci/docker@2.1.1

jobs:
  build-and-push:
    docker:
      - image: cimg/base:current
    steps:
      - checkout # Étape pour récupérer le code source

      - docker/build:
          path: ../dockerfile
          tag: loutron34/monapp:latest
      - docker/push:
          name: loutron34/monapp
          tag: latest

workflows:
  version: 2
  build:
    jobs:
      - build-and-push
