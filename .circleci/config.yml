version: 2.1

executors:
  docker-executor:
    docker:
      - image: cimg/base:current

jobs:
  say-hello:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: "Say hello"
          command: "echo Hello, World!"

  build-docker:
    executor: docker-executor
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: |
            docker build -t monapp:latest .

      - run:
          name: Test Docker image
          command: |
            docker run --rm -d -p 8080:8080 --name test-container monapp:latest
            sleep 30  # Attendre un peu plus longtemps pour s'assurer que l'application démarre
            response=$(curl -i -s http://localhost:8080)  # Récupérer la réponse HTTP complète
            echo "$response"  # Afficher la réponse pour débogage
            status_code=$(echo "$response" | grep -oP 'HTTP/\d+\.\d+\s+\K\d{3}')  # Extraire le code de statut
            echo "Status code: $status_code"  # Afficher le code pour débogage
            if [ "$status_code" -ne 200 ]; then  # Si le code n'est pas 200
              echo "L'application ne répond pas avec le statut attendu (200)" && exit 1
            fi
            docker stop test-container

workflows:
  version: 2
  build-workflow:
    jobs:
      - say-hello
      - build-docker
